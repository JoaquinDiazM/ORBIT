<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="orbit-title" shape-rendering="geometricPrecision">
  <title id="orbit-title">ORBIT</title>
  <rect width="64" height="64" rx="14" fill="#08111f"/>
  <path d="M32 7 52 18.5v27L32 57 12 45.5v-27Z"
        fill="#17304e"
        stroke="#78e3ff"
        stroke-width="3"
        stroke-linejoin="round"/>

  <!-- La O está formada por dos contornos elípticos concéntricos. -->
  <g fill="none"
     stroke="#ffd166"
     stroke-linecap="round"
     transform="rotate(-18 32 32)">
    <ellipse cx="32" cy="32"
             rx="10.6" ry="14"
             stroke-width="2.6"/>
    <ellipse cx="32" cy="32"
             rx="6" ry="8.2"
             stroke-width="2.35"/>
  </g>

  <!-- Cuerpos orbitales: exterior al noreste e interior al suroeste. -->
  <circle cx="39.994" cy="24.368"
          r="2.15" fill="#f6fbff"/>
  <circle cx="28.325" cy="37.505"
          r="1.8" fill="#f6fbff"/>
</svg>
