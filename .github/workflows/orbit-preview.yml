name: Build ORBIT 1.3.0 review packages

on:
  push:
    branches: ['codex/orbit-1.3.0-preview']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - run: npm ci
      - run: npm run check
      - run: |
          node scripts/set-release-version.mjs 1.3.0
          npm run build
          node scripts/package-server.mjs --release-tag v1.3.0
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-server-preview
          path: artifacts/orbit-servidor.tar.gz*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: |
          npm ci
          node scripts/set-release-version.mjs 1.3.0
          npm run build
          node scripts/stage-android.mjs
      - name: Sign the isolated Android preview and verify it
        run: |
          export ORBIT_PREVIEW_PASSWORD=$(openssl rand -hex 24)
          key="$RUNNER_TEMP/orbit-preview.p12"
          keytool -genkeypair -alias orbit-preview -keyalg RSA -keysize 2048 -validity 3650 \
            -storetype PKCS12 -keystore "$key" -storepass:env ORBIT_PREVIEW_PASSWORD \
            -dname 'CN=ORBIT Preview'
          gradle -p android :app:assembleRelease --no-daemon \
            -PorbitPreview=true -PorbitVersion=1.3.0-preview.1 -PorbitPreviewKeystore="$key"
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/orbit-android-prueba.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/orbit-android-prueba.apk
          rm "$key"
          (cd artifacts && sha256sum orbit-android-prueba.apk > orbit-android-prueba.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-android-preview
          path: artifacts/orbit-android-prueba.apk*
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    env:
      RUSTUP_TOOLCHAIN: '1.100.0'
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - run: npm ci
      - run: rustup toolchain install 1.100.0 --profile minimal
      - name: Build Windows preview with separate identity
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/set-release-version.mjs 1.3.0
          $overlay = Join-Path $env:RUNNER_TEMP 'orbit-preview.json'
          @{
            productName = 'ORBIT Prueba'
            identifier = 'io.github.joaquindiazm.orbit.preview'
            version = '1.3.0-preview.1'
            app = @{ windows = @(@{ label = 'launcher'; title = 'ORBIT Prueba'; width = 680; height = 690 }) }
            bundle = @{ windows = @{ nsis = @{ startMenuFolder = 'ORBIT Prueba' } } }
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $overlay -Encoding utf8NoBOM
          npm run desktop -- build --ci --target x86_64-pc-windows-msvc --config $overlay -- --locked
          $exe = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*-setup.exe')
          if ($exe.Count -ne 1) { throw 'Expected one preview installer.' }
          Copy-Item -LiteralPath $exe[0].FullName -Destination artifacts/orbit-windows-prueba.exe
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-windows-preview
          path: artifacts/orbit-windows-prueba.exe
          if-no-files-found: error
